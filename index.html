<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RP3D Online</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#game{width:100%;height:100%;touch-action:none}.ui{position:fixed;z-index:5;color:#fff;background:#0009;padding:8px;border-radius:8px}#status{top:10px;left:10px}#players{top:48px;left:10px}#controls{position:fixed;left:15px;bottom:18px;z-index:5;display:grid;grid-template-columns:58px 58px 58px;gap:6px}button{width:58px;height:52px;border:0;border-radius:12px;background:#ffffff44;color:#fff;font-size:20px}#up{grid-column:2}.empty{visibility:hidden}#actions{position:fixed;right:15px;bottom:18px;z-index:5}#shop{display:none;position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:20px;border-radius:16px;min-width:220px}#shop button{display:block;width:100%;margin:7px 0;background:#ddd;color:#111}</style></head><body><canvas id="game"></canvas><div id="status" class="ui">Connecting...</div><div id="players" class="ui">Players: 0</div><div id="controls"><button class="empty"></button><button id="up">▲</button><button class="empty"></button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div><div id="actions"><button id="enterBtn">ENTER / EXIT</button><button id="shopBtn">SHOP</button></div><div id="shop"><h2>Small Shop</h2><p id="money">Money: $500</p><button data-item="Water">Buy Water - $20</button><button data-item="Food">Buy Food - $50</button><button data-item="Medkit">Buy Medkit - $100</button><button id="closeShop">Close</button></div><script src="/socket.io/socket.io.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script><script type="module" src="/src/main.js"></script></body></html>
