<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>RP3D Online</title><style>html,body{margin:0;height:100%;overflow:hidden}#game{width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}button{pointer-events:auto;padding:13px;border:0;border-radius:12px}#controls{position:absolute;right:15px;bottom:18px;display:flex;gap:8px}#status{position:absolute;left:12px;top:12px;background:#0009;color:white;padding:9px;border-radius:9px}#shop{display:none;pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fffe;padding:20px;border-radius:16px;min-width:230px}#shop button{display:block;width:100%;margin:7px 0}</style></head><body><canvas id="game"></canvas><div id="ui"><div id="status">Connecting...</div><div id="controls"><button id="enterBtn">ENTER / EXIT</button><button id="shopBtn">SHOP</button></div><div id="shop"><h2>Small Shop</h2><p id="money">Money: $500</p><button data-item="Water" data-price="20">Buy Water - $20</button><button data-item="Food" data-price="50">Buy Food - $50</button><button data-item="Medkit" data-price="100">Buy Medkit - $100</button><button id="closeShop">Close</button></div></div><script type="module" src="/src/main.js"></script></body></html>
